name: Build Android App

on:
  push:
    branches: ["main"]
  # No branch filter: stacked phase PRs (base = previous phase branch)
  # must run CI on their own PRs, not only PRs targeting main.
  pull_request:

jobs:
  # Phase 3.6 close-out: the single "Run unit tests" step had grown
  # to ~7 minutes and kept dying mid-step (exit 143 / cancelled).
  # Stage 1 split the suite into two parallel shard jobs (fast JVM
  # tests / Compose-UI tests, via -PnotaTestShard in
  # app/build.gradle.kts) and bounded the test workers (heap/fork).
  # Stage 2 attacks the remaining killer — the ~4 min COLD Kotlin
  # compile inside every test step: setup-gradle now caches the
  # Gradle User Home (dependencies + wrapper + local build cache)
  # across jobs and attempts, and the fast shard is split AGAIN
  # into two parallel jobs (test-fast-a / test-fast-b) with
  # explicit, deterministic --tests class lists partitioning the
  # 45 non-UI classes 23/22 (UI classes stay in test-ui).
  # build-android runs once all three test jobs are green.
  # (Phase 4.1: the non-UI partition is now 52 classes, 26/26
  # across fast-a and the three B shards.)
  # (Phase 4.2: the partition grows to 57 classes — fast-a +2
  # pure-JVM semantic classes, B +1 backup-exclusion, B3 +2
  # store/indexer; B2 keeps its pre-4.1 composition.)
  # (Phase 4.3: the partition grows to 60 classes — fast-a +2
  # pure-JVM Ask classes, B3 +1 Ask Robolectric suite.)
  # (PR #25 fix round: 61 classes — B3 +1 Ask ViewModel
  # Robolectric suite.)
  # (Phase 4.4: the partition grows to 63 classes — fast-a +2
  # pure-JVM link-graph classes, B3 +1 graph Robolectric suite.)
  # (PR #26 fix round: the partition grows to 65 classes —
  # fast-a +2 pure-JVM link-graph fix classes.)
  # (v0.8.1: the partition grows to 66 classes — fast-a +1
  # pure-JVM note-lock gate auto-prompt test.)
  # (Phase 5.1: the partition grows to 73 classes — fast-a +4
  # reminder pure-JVM classes, B +2 reminder Robolectric suites,
  # B3 +1 reminder fire-handler Robolectric suite.)
  # (PR #28 fix round: the partition grows to 76 classes —
  # fast-a +3 reminder fix classes.)
  # (Phase 5.2: the partition grows to 83 classes — fast-a +3
  # pure-JVM capture classes, B +2 capture Robolectric suites,
  # B3 +1 door-intent Robolectric suite. The 76 above undercounts
  # the enumerated lists by one; 83 is the true enumerated total.)
  # (Phase 5.3: the partition grows to 86 classes — fast-a +1
  # pure-JVM widget state-mapper class, B +1 widget data-source
  # Robolectric suite, B3 +1 widget intents Robolectric suite.)
  # (Phase 5.4: the partition grows to 89 classes — fast-a +3
  # pure-JVM voice classes (transcript assembly, session machine,
  # probe mapping); the voice door cases extend the existing B3
  # door-intent Robolectric suite, so no new B/B3 class.)
  # (Phase 6 polish: the partition grows to 90 classes — fast-a +1
  # corruption/App-Lock fail-closed Robolectric suite; the Settings
  # reorganisation UI suite joins the UI shard's class list in
  # app/build.gradle.kts, not this partition.)
  # (Editor Refinement #1: the partition grows to 92 classes —
  # B3 +2 pure-JVM editor classes (table operations; refinement
  # palettes/URL validation); the editor refinement UI suite joins
  # the UI shard's class list in app/build.gradle.kts, not this
  # partition.)
  # (Beginner AI Setup #1: the partition grows to 95 classes —
  # fast-a +2 pure-JVM AI classes (provider help table; setup
  # copy compositions), B3 +1 search-hint Robolectric suite; the
  # beginner-setup UI suite joins the UI shard's class list in
  # app/build.gradle.kts, not this partition.)
  # (Per-note Export #1: the partition grows to 99 classes —
  # fast-a +4 pure-JVM export classes (Markdown / HTML / text
  # converters and the filename sanitiser); the export UI suite
  # joins the UI shard's class list in app/build.gradle.kts, not
  # this partition.)
  # (Per-note Export #1 fix round: the partition grows to 100
  # classes — fast-a +1 export delivery Robolectric suite (unique
  # share cache paths + stale-export pruning).)
  # (Editor Refinement #2: the partition shrinks to 99 classes —
  # B3 −1: TapBelowContentTest is deleted with the tap-anywhere
  # growth it covered; the conversion cases extend the existing
  # NoteDocument / CaretSplit / read-mode suites, so no new class.)
  # (Charts PR-A: the partition grows to 101 classes — fast-a +2
  # pure-JVM chart classes (parser/normaliser; colour conversion);
  # the chart round-trip cases extend NoteDocumentTest and the
  # read-mode chart cases extend EditorReadModeUiTest, so the B
  # and UI shards gain no new class.)
  # (Charts PR-B: the partition grows to 102 classes — fast-a +1
  # pure-JVM chart serialiser class; the chart editor dialog suite
  # joins the UI shard's class list in app/build.gradle.kts, and
  # the full-screen chart edit cases extend EditorReadModeUiTest.)
  # (Charts polish: the partition grows to 103 classes — fast-a +1
  # pure-JVM chart hit-model class; the chart view interaction
  # suite joins the UI shard's class list in app/build.gradle.kts.)
  # (Rich cells + nested checklists: the partition grows to 105
  # classes — B +2 pure-JVM classes (nested task-list fidelity;
  # task tree operations); the rich-cells/nested UI suite joins
  # the UI shard's class list in app/build.gradle.kts.)
  # (Autolink + [[ popup: the partition grows to 107 classes —
  # fast-a +2 pure-JVM classes (autolink; caret-anchor popup).)
  # (Typography + version history: the partition grows to 110
  # classes — B +3 (the version-history Robolectric suite; the
  # writing-preferences suite; the writing summary/style
  # pure-JVM suite); the lock-purge and backup-exclusion cases
  # extend the existing B2 lock suite and B backup suite, and
  # the version-history UI suite joins the UI shard's class list
  # in app/build.gradle.kts.)
  # (Extras bundle: the enumerated partition now stands at 114
  # classes — fast-a +2 (the Clock hand-off intent suite; the
  # dictation language resolver), B +1 (the 6→7 migration suite);
  # the tone-persistence, backup-exclusion, theme-mapping and
  # preference cases extend the existing reminder, theme and
  # writing-preferences suites, and the extras settings/dialog
  # suite joins the UI shard's class list in
  # app/build.gradle.kts.)
  # (Extras bundle fix round: the partition grows to 116 classes —
  # fast-a +1 (the speech pending-start gate), B +1 (the sync-apply
  # device-local preservation Robolectric suite).)
  # (Phase 6.1 revival: the partition grows to 118 classes —
  # fast-a +1 list-rows Robolectric suite, B3 +1 semantic-cache
  # Robolectric suite.)
  # (Phase 6.1 fix round: the partition grows to 119 classes —
  # fast-a +1 (the semantic cache slot's generation-discipline
  # suite).)
  # (Ask Aurora, v0.26.0: the partition grows to 120 classes —
  # fast-a +1 (the editor caret/selection ink mapping); the
  # status-bar polarity cases extend the existing theme suite,
  # and the Ask Aurora UI suite joins the UI shard's class list
  # in app/build.gradle.kts.)
  test-fast-a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Phase 3.6 close-out (stage 2): Gradle User Home caching via
      # setup-gradle — dependencies, wrapper AND the local build
      # cache (org.gradle.caching=true in gradle.properties) are
      # restored across jobs/attempts, so no job pays the ~4 min
      # cold Kotlin compile that kept outliving the runner fleet.
      # cache-read-only is explicitly false: the action's default
      # writes only from the default branch, and this workflow's
      # proving runs live on PR branches.
      # (setup-java's own cache: gradle is intentionally NOT used —
      # the two mechanisms interfere per gradle/actions docs.)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Phase 3a: google-services.json is never committed (Noma
      # precedent) — materialise it from the repo secret before any
      # Gradle task runs. The google-services plugin fails the build
      # without it, which is the point: a build that cannot reach the
      # right Firebase project must not ship.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      - name: Run fast unit tests (shard A, 66 of 114 non-UI classes)
        run: |
          ./gradlew -PnotaTestShard=fast :app:testDebugUnitTest \
            --tests "app.nota.data.DatabaseNamingTest" \
            --tests "app.nota.data.ai.AiProviderHelpTest" \
            --tests "app.nota.data.ai.AiSettingsStoreTest" \
            --tests "app.nota.data.ai.AskNotaTest" \
            --tests "app.nota.data.ai.NoteChunkerTest" \
            --tests "app.nota.data.ai.SemanticIndexCacheSlotTest" \
            --tests "app.nota.data.ai.SemanticMathTest" \
            --tests "app.nota.data.ai.TagListParserTest" \
            --tests "app.nota.data.chart.ChartDataParserTest" \
            --tests "app.nota.data.chart.ChartColorsTest" \
            --tests "app.nota.data.chart.ChartSerializerTest" \
            --tests "app.nota.feature.chart.ChartHitModelTest" \
            --tests "app.nota.feature.settings.AiSettingsFormTest" \
            --tests "app.nota.feature.settings.AiSetupCopyTest" \
            --tests "app.nota.feature.ask.AskThreadTest" \
            --tests "app.nota.feature.graph.LinkGraphLayoutTest" \
            --tests "app.nota.feature.graph.LinkGraphTest" \
            --tests "app.nota.feature.graph.LinkGraphFitTest" \
            --tests "app.nota.feature.graph.LinkGraphPositionerTest" \
            --tests "app.nota.data.attachments.PendingInsertStoreTest" \
            --tests "app.nota.data.auth.GuestLibraryTransferTest" \
            --tests "app.nota.data.backup.BackupCrossoverRobolectricTest" \
            --tests "app.nota.data.backup.BackupRichFormattingRestoreTest" \
            --tests "app.nota.data.backup.PendingRestoreStoreTest" \
            --tests "app.nota.data.drive.DriveClientTest" \
            --tests "app.nota.data.html.NoteDocumentFileSegmentTest" \
            --tests "app.nota.data.html.NoteDocumentBlockDeletionTest" \
            --tests "app.nota.data.preferences.NoteLockBiometricCopyScopingTest" \
            --tests "app.nota.data.preferences.PreferencesCorruptionAppLockTest" \
            --tests "app.nota.data.repository.FtsQueryBuilderTest" \
            --tests "app.nota.data.repository.NoteRepositoryRobolectricTest" \
            --tests "app.nota.data.repository.NoteListRowsRobolectricTest" \
            --tests "app.nota.data.security.AppLockBiometricStoreTest" \
            --tests "app.nota.data.security.AppLockManagerSetupTest" \
            --tests "app.nota.data.security.NoteLockRecordTest" \
            --tests "app.nota.data.sync.SyncEngineTest" \
            --tests "app.nota.data.text.RichBodyTest" \
            --tests "app.nota.feature.editor.AutoLinkTest" \
            --tests "app.nota.feature.editor.EditorCursorTest" \
            --tests "app.nota.feature.editor.LinkSuggestionsTest" \
            --tests "app.nota.feature.editor.CaretSplitRobolectricTest" \
            --tests "app.nota.feature.editor.ImagePinchMathTest" \
            --tests "app.nota.feature.editor.PendingInsertResumerTest" \
            --tests "app.nota.feature.lock.LegacyFingerprintPromptCoordinatorTest" \
            --tests "app.nota.feature.lock.LegacyFingerprintPromptStateMachineTest" \
            --tests "app.nota.feature.lock.NoteLockGateAutoPromptTest" \
            --tests "app.nota.data.reminders.AtomicTextFileTest" \
            --tests "app.nota.data.reminders.ReminderIdsTest" \
            --tests "app.nota.data.reminders.ReminderNotificationTextTest" \
            --tests "app.nota.data.reminders.ReminderSchedulerTest" \
            --tests "app.nota.feature.reminders.ClockAlarmDatesTest" \
            --tests "app.nota.feature.reminders.PhoneAlarmIntentsTest" \
            --tests "app.nota.feature.reminders.ReminderTriggerTimesTest" \
            --tests "app.nota.feature.reminders.RemindersSectionTest" \
            --tests "app.nota.data.capture.ShareNormalizerTest" \
            --tests "app.nota.feature.capture.PendingCaptureResumerTest" \
            --tests "app.nota.feature.capture.NotePinLabelsTest" \
            --tests "app.nota.feature.widget.WidgetStateMapperTest" \
            --tests "app.nota.feature.voice.SpeechTextTest" \
            --tests "app.nota.feature.voice.SpeechLanguageTest" \
            --tests "app.nota.feature.voice.StartGateTest" \
            --tests "app.nota.feature.voice.SpeechSessionTest" \
            --tests "app.nota.feature.voice.VoiceProbeUiTest" \
            --tests "app.nota.feature.export.NoteExportMarkdownTest" \
            --tests "app.nota.feature.export.NoteExportHtmlTest" \
            --tests "app.nota.feature.export.NoteExportTextTest" \
            --tests "app.nota.feature.export.NoteExportFilenameTest" \
            --tests "app.nota.feature.export.NoteExportDeliveryTest" \
            --tests "app.nota.feature.spike.HtmlRoundTripProbeTest" \
            --tests "app.nota.ui.theme.ThemeSelectionTest" \
            --stacktrace

      - name: Upload fast-shard-A test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-fast-a
          path: |
            app/build/probe-output
            app/build/reports/tests
          if-no-files-found: ignore

  test-fast-b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Phase 3.6 close-out (stage 2): Gradle User Home caching via
      # setup-gradle — dependencies, wrapper AND the local build
      # cache (org.gradle.caching=true in gradle.properties) are
      # restored across jobs/attempts, so no job pays the ~4 min
      # cold Kotlin compile that kept outliving the runner fleet.
      # cache-read-only is explicitly false: the action's default
      # writes only from the default branch, and this workflow's
      # proving runs live on PR branches.
      # (setup-java's own cache: gradle is intentionally NOT used —
      # the two mechanisms interfere per gradle/actions docs.)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Phase 3a: google-services.json is never committed (Noma
      # precedent) — materialise it from the repo secret before any
      # Gradle task runs. The google-services plugin fails the build
      # without it, which is the point: a build that cannot reach the
      # right Firebase project must not ship.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      # Phase 3.8 diagnosis round: shard B is split THREE ways
      # (B/B2/B3). The combined step needed ~4.5-5 min and the
      # runner fleet killed it mid-step twelve consecutive times
      # on 2026-11-03 (always ~3.5-4 min in, zero test failures in
      # any partial log), while every shorter shard completed.
      # Each third fits the survival window the other shards
      # already enjoy. The PARTITION is unchanged in total:
      # B ∪ B2 ∪ B3 is exactly the old shard-B class list.
      # Phase 4.1: the partition grows by the AI classes
      # (B +1, B2 +0, B3 +3 — 27 across the three B shards).
      # Phase 4.2: B +1 (SemanticBackupExclusionTest, beside its
      # 4.1 sibling), B3 +2 (SemanticIndexStoreTest,
      # SemanticIndexerRobolectricTest) — 29 across the B shards.
      # B2 deliberately gets NONE of the new classes: with the
      # two AI classes in its fork pool, NoteLockRepository's
      # rollback test failed deterministically (3 runs) though
      # it touches no AI code — a fork-composition interaction
      # (Robolectric sandbox/classloader neighbours). B2 keeps
      # its pre-4.1 composition, which was green on main.
      - name: Run fast unit tests (shard B, 21 of 48 shard-B classes)
        run: |
          ./gradlew -PnotaTestShard=fast :app:testDebugUnitTest \
            --tests "app.nota.data.ai.AiBackupExclusionTest" \
            --tests "app.nota.data.ai.SemanticBackupExclusionTest" \
            --tests "app.nota.data.attachments.ImageSamplingTest" \
            --tests "app.nota.data.auth.GuestMovePolicyTest" \
            --tests "app.nota.data.backup.BackupRestoreSemanticsTest" \
            --tests "app.nota.data.backup.BlockOrderBackupRoundTripTest" \
            --tests "app.nota.data.db.DatabaseProviderSwitchingTest" \
            --tests "app.nota.data.db.Migration67RobolectricTest" \
            --tests "app.nota.data.sync.SyncApplierDeviceLocalTest" \
            --tests "app.nota.data.drive.DriveRepositoryTest" \
            --tests "app.nota.data.html.NoteDocumentTest" \
            --tests "app.nota.data.html.NoteDocumentNestedTest" \
            --tests "app.nota.data.html.TaskTreeTest" \
            --tests "app.nota.data.preferences.PreferencesSwipeActionTest" \
            --tests "app.nota.data.preferences.PreferencesWritingTest" \
            --tests "app.nota.data.reminders.ReminderRepositoryRobolectricTest" \
            --tests "app.nota.data.reminders.ReminderBackupConsistencyRobolectricTest" \
            --tests "app.nota.data.repository.VersionHistoryRobolectricTest" \
            --tests "app.nota.feature.settings.WritingStyleTest" \
            --tests "app.nota.data.capture.PendingCaptureStoreTest" \
            --tests "app.nota.data.capture.ShareIntentsRobolectricTest" \
            --tests "app.nota.feature.widget.WidgetDataSourceRobolectricTest" \
            --stacktrace

      - name: Upload fast-shard-B test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-fast-b
          path: |
            app/build/probe-output
            app/build/reports/tests
          if-no-files-found: ignore

