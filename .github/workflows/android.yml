name: Build Android App

on:
  push:
    branches: ["main"]
  # No branch filter: stacked phase PRs (base = previous phase branch)
  # must run CI on their own PRs, not only PRs targeting main.
  pull_request:

jobs:
  # Phase 3.6 close-out: the single "Run unit tests" step had grown
  # to ~7 minutes and kept dying mid-step (exit 143 / cancelled).
  # Stage 1 split the suite into two parallel shard jobs (fast JVM
  # tests / Compose-UI tests, via -PnotaTestShard in
  # app/build.gradle.kts) and bounded the test workers (heap/fork).
  # Stage 2 attacks the remaining killer — the ~4 min COLD Kotlin
  # compile inside every test step: setup-gradle now caches the
  # Gradle User Home (dependencies + wrapper + local build cache)
  # across jobs and attempts, and the fast shard is split AGAIN
  # into two parallel jobs (test-fast-a / test-fast-b) with
  # explicit, deterministic --tests class lists partitioning the
  # 45 non-UI classes 23/22 (UI classes stay in test-ui).
  # build-android runs once all three test jobs are green.
  # (Phase 4.1: the non-UI partition is now 52 classes, 26/26
  # across fast-a and the three B shards.)
  # (Phase 4.2: the partition grows to 57 classes — fast-a +2
  # pure-JVM semantic classes, B +1 backup-exclusion, B3 +2
  # store/indexer; B2 keeps its pre-4.1 composition.)
  # (Phase 4.3: the partition grows to 60 classes — fast-a +2
  # pure-JVM Ask classes, B3 +1 Ask Robolectric suite.)
  # (PR #25 fix round: 61 classes — B3 +1 Ask ViewModel
  # Robolectric suite.)
  # (Phase 4.4: the partition grows to 63 classes — fast-a +2
  # pure-JVM link-graph classes, B3 +1 graph Robolectric suite.)
  # (PR #26 fix round: the partition grows to 65 classes —
  # fast-a +2 pure-JVM link-graph fix classes.)
  # (v0.8.1: the partition grows to 66 classes — fast-a +1
  # pure-JVM note-lock gate auto-prompt test.)
  # (Phase 5.1: the partition grows to 73 classes — fast-a +4
  # reminder pure-JVM classes, B +2 reminder Robolectric suites,
  # B3 +1 reminder fire-handler Robolectric suite.)
  test-fast-a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Phase 3.6 close-out (stage 2): Gradle User Home caching via
      # setup-gradle — dependencies, wrapper AND the local build
      # cache (org.gradle.caching=true in gradle.properties) are
      # restored across jobs/attempts, so no job pays the ~4 min
      # cold Kotlin compile that kept outliving the runner fleet.
      # cache-read-only is explicitly false: the action's default
      # writes only from the default branch, and this workflow's
      # proving runs live on PR branches.
      # (setup-java's own cache: gradle is intentionally NOT used —
      # the two mechanisms interfere per gradle/actions docs.)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Phase 3a: google-services.json is never committed (Noma
      # precedent) — materialise it from the repo secret before any
      # Gradle task runs. The google-services plugin fails the build
      # without it, which is the point: a build that cannot reach the
      # right Firebase project must not ship.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      - name: Run fast unit tests (shard A, 39 of 73 non-UI classes)
        run: |
          ./gradlew -PnotaTestShard=fast :app:testDebugUnitTest \
            --tests "app.nota.data.DatabaseNamingTest" \
            --tests "app.nota.data.ai.AiSettingsStoreTest" \
            --tests "app.nota.data.ai.AskNotaTest" \
            --tests "app.nota.data.ai.NoteChunkerTest" \
            --tests "app.nota.data.ai.SemanticMathTest" \
            --tests "app.nota.data.ai.TagListParserTest" \
            --tests "app.nota.feature.settings.AiSettingsFormTest" \
            --tests "app.nota.feature.ask.AskThreadTest" \
            --tests "app.nota.feature.graph.LinkGraphLayoutTest" \
            --tests "app.nota.feature.graph.LinkGraphTest" \
            --tests "app.nota.feature.graph.LinkGraphFitTest" \
            --tests "app.nota.feature.graph.LinkGraphPositionerTest" \
            --tests "app.nota.data.attachments.PendingInsertStoreTest" \
            --tests "app.nota.data.auth.GuestLibraryTransferTest" \
            --tests "app.nota.data.backup.BackupCrossoverRobolectricTest" \
            --tests "app.nota.data.backup.BackupRichFormattingRestoreTest" \
            --tests "app.nota.data.backup.PendingRestoreStoreTest" \
            --tests "app.nota.data.drive.DriveClientTest" \
            --tests "app.nota.data.html.NoteDocumentFileSegmentTest" \
            --tests "app.nota.data.preferences.NoteLockBiometricCopyScopingTest" \
            --tests "app.nota.data.repository.FtsQueryBuilderTest" \
            --tests "app.nota.data.repository.NoteRepositoryRobolectricTest" \
            --tests "app.nota.data.security.AppLockBiometricStoreTest" \
            --tests "app.nota.data.security.AppLockManagerSetupTest" \
            --tests "app.nota.data.security.NoteLockRecordTest" \
            --tests "app.nota.data.sync.SyncEngineTest" \
            --tests "app.nota.data.text.RichBodyTest" \
            --tests "app.nota.feature.editor.CaretSplitRobolectricTest" \
            --tests "app.nota.feature.editor.ImagePinchMathTest" \
            --tests "app.nota.feature.editor.PendingInsertResumerTest" \
            --tests "app.nota.feature.lock.LegacyFingerprintPromptCoordinatorTest" \
            --tests "app.nota.feature.lock.LegacyFingerprintPromptStateMachineTest" \
            --tests "app.nota.feature.lock.NoteLockGateAutoPromptTest" \
            --tests "app.nota.data.reminders.ReminderIdsTest" \
            --tests "app.nota.data.reminders.ReminderNotificationTextTest" \
            --tests "app.nota.data.reminders.ReminderSchedulerTest" \
            --tests "app.nota.feature.reminders.RemindersSectionTest" \
            --tests "app.nota.feature.spike.HtmlRoundTripProbeTest" \
            --tests "app.nota.ui.theme.ThemeSelectionTest" \
            --stacktrace

      - name: Upload fast-shard-A test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-fast-a
          path: |
            app/build/probe-output
            app/build/reports/tests
          if-no-files-found: ignore

  test-fast-b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Phase 3.6 close-out (stage 2): Gradle User Home caching via
      # setup-gradle — dependencies, wrapper AND the local build
      # cache (org.gradle.caching=true in gradle.properties) are
      # restored across jobs/attempts, so no job pays the ~4 min
      # cold Kotlin compile that kept outliving the runner fleet.
      # cache-read-only is explicitly false: the action's default
      # writes only from the default branch, and this workflow's
      # proving runs live on PR branches.
      # (setup-java's own cache: gradle is intentionally NOT used —
      # the two mechanisms interfere per gradle/actions docs.)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Phase 3a: google-services.json is never committed (Noma
      # precedent) — materialise it from the repo secret before any
      # Gradle task runs. The google-services plugin fails the build
      # without it, which is the point: a build that cannot reach the
      # right Firebase project must not ship.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      # Phase 3.8 diagnosis round: shard B is split THREE ways
      # (B/B2/B3). The combined step needed ~4.5-5 min and the
      # runner fleet killed it mid-step twelve consecutive times
      # on 2026-11-03 (always ~3.5-4 min in, zero test failures in
      # any partial log), while every shorter shard completed.
      # Each third fits the survival window the other shards
      # already enjoy. The PARTITION is unchanged in total:
      # B ∪ B2 ∪ B3 is exactly the old shard-B class list.
      # Phase 4.1: the partition grows by the AI classes
      # (B +1, B2 +0, B3 +3 — 27 across the three B shards).
      # Phase 4.2: B +1 (SemanticBackupExclusionTest, beside its
      # 4.1 sibling), B3 +2 (SemanticIndexStoreTest,
      # SemanticIndexerRobolectricTest) — 29 across the B shards.
      # B2 deliberately gets NONE of the new classes: with the
      # two AI classes in its fork pool, NoteLockRepository's
      # rollback test failed deterministically (3 runs) though
      # it touches no AI code — a fork-composition interaction
      # (Robolectric sandbox/classloader neighbours). B2 keeps
      # its pre-4.1 composition, which was green on main.
      - name: Run fast unit tests (shard B, 12 of 35 shard-B classes)
        run: |
          ./gradlew -PnotaTestShard=fast :app:testDebugUnitTest \
            --tests "app.nota.data.ai.AiBackupExclusionTest" \
            --tests "app.nota.data.ai.SemanticBackupExclusionTest" \
            --tests "app.nota.data.attachments.ImageSamplingTest" \
            --tests "app.nota.data.auth.GuestMovePolicyTest" \
            --tests "app.nota.data.backup.BackupRestoreSemanticsTest" \
            --tests "app.nota.data.backup.BlockOrderBackupRoundTripTest" \
            --tests "app.nota.data.db.DatabaseProviderSwitchingTest" \
            --tests "app.nota.data.drive.DriveRepositoryTest" \
            --tests "app.nota.data.html.NoteDocumentTest" \
            --tests "app.nota.data.preferences.PreferencesSwipeActionTest" \
            --tests "app.nota.data.reminders.ReminderRepositoryRobolectricTest" \
            --tests "app.nota.data.reminders.ReminderBackupConsistencyRobolectricTest" \
            --stacktrace

      - name: Upload fast-shard-B test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-fast-b
          path: |
            app/build/probe-output
            app/build/reports/tests
          if-no-files-found: ignore

  test-fast-b2:
    runs-on: ubuntu-latest

    steps:
