      # ~/.m2/repository/org/robolectric — outside the Gradle
      # User Home that setup-gradle caches — so without this the
      # runtime is re-downloaded on every runner. Keyed on the
      # version catalog (which pins Robolectric 4.16.1).
      - name: Cache Robolectric runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.16.1-v2-ui-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-4.16.1-v2-ui-

      # Phase 3a: google-services.json is never committed (Noma
      # precedent) — materialise it from the repo secret before any
      # Gradle task runs. The google-services plugin fails the build
      # without it, which is the point: a build that cannot reach the
      # right Firebase project must not ship.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      # CI pipeline hardening (2026-11-24): prefetch probe —
      # run ONE cheap UI class through the real test task
      # BEFORE the shard step, so the android-all runtime
      # (SDK 35 — every UI suite pins @Config(sdk = [35])) and
      # the native-graphics runtime (nativeruntime-dist-compat)
      # are downloaded (or confirmed cached) here, with
      # retries, instead of mid-step, where a download flake
      # fails every class at sandbox boot. The probe also
      # warms the compile cache for the shard step; its
      # reports are removed afterwards so the uploaded
      # evidence is the shard step's alone.
      - name: Prefetch Robolectric runtime (probe classes)
        run: |
          # If either runtime is missing from the local
          # repository, the probe MUST really execute: a
          # build-cache hit would skip the test JVM entirely
          # and fetch nothing. --no-build-cache forces a real
          # execution on that path only.
          extra=""
          if ! ls ~/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-*/ >/dev/null 2>&1 \
             || ! ls ~/.m2/repository/org/robolectric/nativeruntime-dist-compat/ >/dev/null 2>&1; then
            echo "Robolectric runtime incomplete in local repository - forcing a real probe execution."
            extra="--no-build-cache"
          fi
          probe() {
            ./gradlew -PnotaTestShard=ui :app:testDebugUnitTest $extra \
              --tests "app.nota.feature.notes.SwipeUndoRaceUiTest" \
              --stacktrace
          }
          ok=0
          for attempt in 1 2 3; do
            if probe; then ok=1; break; fi
            echo "Robolectric prefetch attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "Prefetch failed 3 times - clearing possibly-poisoned cache and retrying clean..."
            rm -rf ~/.m2/repository/org/robolectric
            extra="--no-build-cache"
            probe
          fi
          rm -rf app/build/reports/tests app/build/test-results

      - name: Run Compose-UI tests
        run: ./gradlew -PnotaTestShard=ui :app:testDebugUnitTest --stacktrace

      - name: Upload UI-shard test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence-ui
          path: |
            app/build/probe-output
            app/build/reports/tests
          if-no-files-found: ignore

  build-android:
    needs: [test-fast-a, test-fast-b, test-fast-b2, test-fast-b3, test-fast-b4, test-fast-b5, test-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Phase 3.6 close-out (stage 2): Gradle User Home caching via
      # setup-gradle — dependencies, wrapper AND the local build
      # cache (org.gradle.caching=true in gradle.properties) are
      # restored across jobs/attempts, so no job pays the ~4 min
      # cold Kotlin compile that kept outliving the runner fleet.
      # cache-read-only is explicitly false: the action's default
      # writes only from the default branch, and this workflow's
      # proving runs live on PR branches.
      # (setup-java's own cache: gradle is intentionally NOT used —
      # the two mechanisms interfere per gradle/actions docs.)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Phase 3a: google-services.json is never committed (Noma
      # precedent) — materialise it from the repo secret before any
      # Gradle task runs. The google-services plugin fails the build
      # without it, which is the point: a build that cannot reach the
      # right Firebase project must not ship.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      - name: Setup Stable Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Stable debug keystore configured."
          else
            echo "ERROR: ANDROID_DEBUG_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi

      - name: Build Android debug APK
        env:
          DKS_PW: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          DK_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DK_PW: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          S=android.injected.signing
          W=pass
          W=${W}word
          ./gradlew assembleDebug -P$S.store.file=$HOME/.android/debug.keystore -P$S.store.$W=$DKS_PW -P$S.key.alias=$DK_ALIAS -P$S.key.$W=$DK_PW

      - name: Print debug APK signing certificate
        run: |
          build_tools_dir=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $build_tools_dir/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ~/.android/release.keystore
            echo "Release keystore configured."
          else
            echo "ERROR: ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi

      - name: Build signed release APK and bundle
        env:
          RKS_PW: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RK_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RK_PW: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          S=android.injected.signing
          W=pass
          W=${W}word
          ./gradlew assembleRelease bundleRelease -P$S.store.file=$HOME/.android/release.keystore -P$S.store.$W=$RKS_PW -P$S.key.alias=$RK_ALIAS -P$S.key.$W=$RK_PW

      - name: Print release APK signing certificate
        run: |
          build_tools_dir=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $build_tools_dir/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore
