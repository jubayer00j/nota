name: Stress flakes proof (scratch, PR #65)

# TEMPORARY proof workflow for the flake-hardening round. Lives only
# on the stress/flake-proof branch (fixes commit + this file); the
# PR branch never contains it.

on:
  workflow_dispatch:
  push:
    branches: [stress/flake-proof]

jobs:
  stress-t1-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Robolectric runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.16.1-v2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-4.16.1-v2-

      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      - name: Stress BackupRestoreSemanticsTest x20
        run: |
          mkdir -p stress-out
          passes=0; fails=0
          for i in $(seq 1 20); do
            rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
            ./gradlew -PnotaTestShard=fast :app:testDebugUnitTest --no-build-cache \
              --tests "app.nota.data.backup.BackupRestoreSemanticsTest" \
              --stacktrace > stress-out/iter-$i.log 2>&1
            code=$?
            mkdir -p stress-out/iter-$i
            cp -r app/build/test-results/testDebugUnitTest stress-out/iter-$i/results 2>/dev/null || true
            echo "iter $i exit=$code" | tee -a stress-out/summary.txt
            if [ $code -eq 0 ]; then passes=$((passes+1)); else fails=$((fails+1)); fi
          done
          echo "PASSES=$passes FAILURES=$fails" | tee -a stress-out/summary.txt

      - name: Upload stress output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-t1-proof-out
          path: stress-out
          if-no-files-found: ignore

  stress-t2-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Robolectric runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.16.1-v2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-4.16.1-v2-

      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      - name: Stress NoteImportRobolectricTest x20
        run: |
          mkdir -p stress-out
          passes=0; fails=0
          for i in $(seq 1 20); do
            rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
            ./gradlew -PnotaTestShard=fast :app:testDebugUnitTest --no-build-cache \
              --tests "app.nota.data.importing.NoteImportRobolectricTest" \
              --stacktrace > stress-out/iter-$i.log 2>&1
            code=$?
            mkdir -p stress-out/iter-$i
            cp -r app/build/test-results/testDebugUnitTest stress-out/iter-$i/results 2>/dev/null || true
            echo "iter $i exit=$code" | tee -a stress-out/summary.txt
            if [ $code -eq 0 ]; then passes=$((passes+1)); else fails=$((fails+1)); fi
          done
          echo "PASSES=$passes FAILURES=$fails" | tee -a stress-out/summary.txt

      - name: Upload stress output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-t2-proof-out
          path: stress-out
          if-no-files-found: ignore
