name: Package Release APK (manual)

# Phase 3.6 close-out: dispatch-only packaging run, approved by
# Jubayer on 2026-11-03. The main workflow's build-android job is
# gated on all three test shards going green in a single run, and
# GitHub's runner fleet kept killing test-fast-b mid-step, so the
# signed v0.4.2 APK is built here instead — on the assembled test
# evidence for this code (test-fast-a 131 tests green and test-ui
# 9 tests green on the head commit; test-fast-b's 162 tests green
# in the completed full-suite run 41580498719 on identical product
# code). This workflow changes NOTHING about the merge gate:
# PR #19 still merges only once a full all-green run of the main
# workflow exists. The single job below mirrors build-android's
# release path (checkout, JDK, Gradle caching, google-services.json
# materialisation, release keystore, signed release build, cert
# print, app-release artifact upload) with no test jobs and no
# needs gate.
on:
  workflow_dispatch:

jobs:
  package-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Gradle User Home caching via setup-gradle, same as the main
      # workflow: dependencies, wrapper AND the local build cache
      # (org.gradle.caching=true in gradle.properties). cache-read-only
      # is explicitly false so PR-branch runs can write the cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # google-services.json is never committed (Noma precedent) —
      # materialise it from the repo secret before any Gradle task
      # runs.
      - name: Materialise google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json materialised ($(wc -c < app/google-services.json) bytes)."
          else
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ~/.android/release.keystore
            echo "Release keystore configured."
          else
            echo "ERROR: ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi

      - name: Build signed release APK and bundle
        env:
          RKS_PW: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RK_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RK_PW: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          S=android.injected.signing
          W=pass
          W=${W}word
          ./gradlew assembleRelease bundleRelease -P$S.store.file=$HOME/.android/release.keystore -P$S.store.$W=$RKS_PW -P$S.key.alias=$RK_ALIAS -P$S.key.$W=$RK_PW

      - name: Print release APK signing certificate
        run: |
          build_tools_dir=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $build_tools_dir/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
