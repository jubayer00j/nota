[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
koin = "4.2.2"
richEditor = "1.2.1"
ksp = "2.3.13"
junit = "4.13.2"
datastore = "1.3.0"
profileInstaller = "1.4.1"
baselineProfile = "1.5.0"
coil = "3.6.3"
robolectric = "4.16.1"
biometric = "1.1.0"
firebaseBom = "35.1.0"
googleServices = "4.5.0"
credentials = "1.6.0"
googleId = "1.2.1"
playServicesAuth = "22.0.0"
workManager = "2.12.0"
okhttp = "5.5.1"

# Verified 2026-11-01 against Maven Central / Google Maven metadata (latest stable):
#  Kotlin 2.4.21, AGP 9.5.0 (Gradle 9.8.2), Compose BOM 2026.09.00,
#  Room 2.8.5, Koin 4.2.2, Compose Rich Editor 1.2.1.
# Phase 1a additions, verified 2026-11-01 against Google Maven metadata
# (latest STABLE in each line; alphas excluded): DataStore Preferences 1.3.0,
# ProfileInstaller 1.4.1, Baseline Profile Gradle plugin 1.5.0.
# Deferred to later phases (verified stable, not yet dependencies):
#  WorkManager 2.12.0 (Phase 3/5), OkHttp 5.5.1 + kotlinx-serialization-json 1.12.0
#  (Phase 3/4), Vico 3.3.1 (Phase 6).
# Phase 1b additions, verified 2026-11-01: Coil3 coil-compose 3.6.3
# (coil-kt docs list 3.6.3 as the current release) and Robolectric 4.16.1
# (latest stable in the 4.16 line) for the Room repository test.
# Phase 2a additions: androidx.biometric 1.1.0 (the stable BiometricPrompt
# line) and lifecycle-process from the existing lifecycle 2.11.0 train
# (ProcessLifecycleOwner for App Lock background tracking).

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-common = { group = "androidx.room", name = "room-common", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
richeditor-compose = { group = "com.mohamedrejeb.richeditor", name = "richeditor-compose", version.ref = "richEditor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
# Google Drive (Phase 3b): AuthorizationClient (drive.file scope) +
# plain REST via OkHttp (the drive.ts equivalent); WorkManager runs
# scheduled backups.
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

[bundles]
compose = [
    "androidx-activity-compose",
]
