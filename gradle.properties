org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
android.useAndroidX=true
# AGP 9 ships a built-in Kotlin integration and a new DSL; Nota applies the
# Kotlin Gradle plugin explicitly (classic setup), so opt out of both for now.
# (Migration to built-in Kotlin is required before AGP 10 — see SPIKE-REPORT.md.)
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
