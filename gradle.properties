org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Phase 3.6 close-out (stage 2): local build cache ON. CI restores the
# Gradle User Home (incl. caches/build-cache-1) via setup-gradle, so
# compile/KSP task outputs are reused across jobs and attempts instead
# of every runner paying a full cold Kotlin compile.
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
# AGP 9 ships a built-in Kotlin integration and a new DSL; Nota applies the
# Kotlin Gradle plugin explicitly (classic setup), so opt out of both for now.
# (Migration to built-in Kotlin is required before AGP 10 — see SPIKE-REPORT.md.)
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
